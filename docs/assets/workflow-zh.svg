<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">TuneTune 研究流程</title>
  <desc id="desc">你提出目标、审阅提案和体现个人判断的参考答案，并试用结果。Agent 调研方法、建立评测与基线，在交付前循环提出假设、运行实验并分析结果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#587087" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1100" height="390" rx="20" fill="#f5f8fc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <rect x="36" y="28" width="1028" height="68" rx="14" fill="#e4edff"/>
    <text x="66" y="125" font-size="18" font-weight="700" fill="#2453a6">你</text>
    <g font-size="15" fill="#2453a6">
      <text x="105" y="69">指引目标</text><text x="513" y="69">审阅方向</text>
      <text x="755" y="59">审核参考答案</text><text x="755" y="80" font-size="12">涉及个人判断时</text>
      <text x="982" y="69">试用与验收</text>
    </g>
    <g fill="none" stroke="#8fa8cc" stroke-width="1.5" stroke-dasharray="4 5">
      <path d="M105 96V148"/><path d="M513 96V148"/><path d="M755 96V148"/><path d="M982 96V148"/>
    </g>
    <g fill="#fff" stroke="#cbd7e5" stroke-width="1.5">
      <rect x="36" y="148" width="138" height="76" rx="12"/>
      <rect x="210" y="148" width="170" height="76" rx="12"/>
      <rect x="416" y="148" width="194" height="76" rx="12"/>
      <rect x="646" y="148" width="218" height="76" rx="12" fill="#e4edff" stroke="#83a6e5"/>
      <rect x="900" y="148" width="164" height="76" rx="12"/>
    </g>
    <g font-size="16" font-weight="600" fill="#20344b">
      <text x="105" y="192">提出需求</text>
      <text x="295" y="180">调研方法</text><text x="295" y="202">澄清问题</text>
      <text x="513" y="180">研究提案</text><text x="513" y="202">资源预算</text>
      <text x="755" y="180">建立评测</text><text x="755" y="202">测量基线</text>
      <text x="982" y="180">交付模型</text><text x="982" y="202">验收结果</text>
    </g>
    <g fill="none" stroke="#587087" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M174 186H202"/><path d="M380 186H408"/><path d="M610 186H638"/>
      <path d="M755 224V267H589"/><path d="M864 300H982V232"/>
    </g>
    <rect x="210" y="267" width="654" height="66" rx="12" fill="#fff" stroke="#83a6e5" stroke-width="1.5"/>
    <g font-size="16" fill="#20344b" font-weight="600">
      <text x="316" y="307">提出假设</text><text x="537" y="307">运行实验</text><text x="755" y="307">分析结果</text>
    </g>
    <g fill="none" stroke="#587087" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M395 300H456"/><path d="M610 300H681"/>
      <path d="M755 333V359H316V341"/>
    </g>
    <text x="537" y="380" font-size="12" fill="#587087">在约定范围与预算内持续迭代</text>
  </g>
</svg>
